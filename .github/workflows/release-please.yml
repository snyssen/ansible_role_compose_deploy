name: release-please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please@v17.6.0
        with:
          release-type: simple
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
